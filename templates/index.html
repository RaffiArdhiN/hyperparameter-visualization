<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperparameter Visualization</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <h1>Hyperparameter Visualization</h1>
    <form id="grad-form">
        <label for="data">Data:</label>
        <textarea id="data" rows="5" cols="40">[[1, 2], [2, 3], [3, 4]]</textarea>
      
        <label for="learning_rate">Learning Rate:</label>
        <input type="number" id="learning_rate" value="0.01" step="0.001">
      
        <label for="iterations">Iterations:</label>
        <input type="number" id="iterations" value="100">
      
        <button type="submit">Run Gradient Descent</button>
      </form>
      
      <div id="output"></div>
      <div id="chart" style="width: 100%; height: 700px;"></div>
      <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
